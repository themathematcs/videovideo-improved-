<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Video B-Roll Assistant</title>
    <meta name="description" content="Analyze video scripts into scenes, generate structured B-roll stock asset plans for Pexels and Pixabay, recommend background music and SFX, and create autonomous videos with live playback and rendering." />
    <meta property="og:title" content="AI Video B-Roll Assistant" />
    <meta property="og:description" content="Analyze video scripts into scenes, generate structured B-roll stock asset plans for Pexels and Pixabay, recommend background music and SFX, and create autonomous videos with live playback and rendering." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <style>
      body {
        background-color: #1c1917;
        margin: 0;
        color: #f5f5f4;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .app-loader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #1c1917;
      }
      .app-loader-spinner {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(245, 158, 11, 0.15);
        border-top-color: #f59e0b;
        border-radius: 50%;
        animation: spin 0.9s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-stone-900 text-stone-100 min-h-screen antialiased selection:bg-amber-500/30 selection:text-amber-200">
    <div id="root">
      <div class="app-loader-container">
        <div class="app-loader-spinner"></div>
        <div style="font-weight: 600; font-size: 1.15rem; color: #f5f5f4; letter-spacing: -0.01em;">
          AI Video B-Roll Assistant
        </div>
        <div style="font-size: 0.875rem; color: #a8a29e; margin-top: 6px;">
          Initializing workspace & autonomous video engine...
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
